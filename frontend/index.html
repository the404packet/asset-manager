<!DOCTYPE html>
<html lang="en">
<head>

    <title>Asset Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Asset Manager (Read Only)</h1>
        <p>View organizational IT assets</p>
    </header>

    <nav>

    <footer>
